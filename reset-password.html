
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - BharathiBookNest</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #30251f;
      background:
        linear-gradient(rgba(255,248,239,0.3),
                        rgba(255,248,239,0.3)),
        url("./bharathiyar-background.png") center / cover fixed;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: #fff8ef;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      color: #713d2b;
      font-size: 25px;
    }

    p {
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bca58e;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #8b4513;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      overflow-wrap: anywhere;
    }

    .home-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #8b4513;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <h1>Reset Your Password</h1>
    <p>Enter a new password for your BharathiBookNest account.</p>

    <form id="newPasswordForm">
      <label for="newPassword">New Password</label>
      <input
        type="password"
        id="newPassword"
        minlength="8"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        required
      >

      <label for="confirmPassword">Confirm New Password</label>
      <input
        type="password"
        id="confirmPassword"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter the password again"
        required
      >

      <button type="submit" id="saveButton">
        Update Password
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="home-link" href="index.html">Back to Home</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    const SUPABASE_URL =
      "https://mlhveuqfxbpucorktost.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("newPasswordForm");
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const saveButton = document.getElementById("saveButton");
    const message = document.getElementById("message");

    let recoveryReady = false;

    // Supabase exchanges the recovery link for a session.
    supabaseClient.auth.onAuthStateChange(
      function(event, session) {
        if (event === "PASSWORD_RECOVERY" && session) {
          recoveryReady = true;
          message.textContent =
            "Reset link verified. You can now set a new password.";
        }
      }
    );

    async function checkRecoverySession() {
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        message.textContent =
          "Unable to verify the reset link. Request a new one.";
        return;
      }

      if (data.session) {
        recoveryReady = true;
        message.textContent =
          "Reset link verified. You can now set a new password.";
      } else {
        message.textContent =
          "Open this page using the password-reset link sent to your email.";
      }
    }

    checkRecoverySession();

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!recoveryReady) {
        message.textContent =
          "Your reset link is not verified. Request a new reset email.";
        return;
      }

      if (newPassword.value.length < 8) {
        message.textContent =
          "Your password must contain at least 8 characters.";
        return;
      }

      if (newPassword.value !== confirmPassword.value) {
        message.textContent = "The passwords do not match.";
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Updating...";
      message.textContent = "";

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: newPassword.value
        });

        if (error) {
          throw error;
        }

        message.textContent =
          "Password updated successfully. You can now log in.";

        form.reset();
        recoveryReady = false;

        await supabaseClient.auth.signOut();

      } catch (error) {
        console.error("Password update failed:", error.message);
        message.textContent =
          "Unable to update your password. Request a new reset link and try again.";
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Update Password";
      }
    });
  </script>
</body>
</html>
