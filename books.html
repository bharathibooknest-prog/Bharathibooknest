<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharathiBookNest - Books</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #30251f;
      min-height: 100vh;
      background-image:
        linear-gradient(
          rgba(255, 248, 239, 0.15),
          rgba(255, 248, 239, 0.15)
        ),
        url("./bharathiyar-background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      padding: 12px 30px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .brand h1 {
      font-size: 24px;
      margin: 0;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    nav a {
      color: #30251f;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }

    nav a:hover {
      color: #a45a31;
      text-decoration: underline;
    }

    nav a.login-btn,
    nav a.register-btn,
    nav a.profile-btn,
    nav a.logout-btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
    }

    nav a.login-btn {
      background-color: #d8b48a;
      color: #30251f;
      border: 1px solid #8b4513;
    }

    nav a.register-btn {
      background-color: #8b4513;
      color: white;
    }

    nav a.profile-btn {
      background-color: #315b42;
      color: white;
    }

    nav a.logout-btn {
      background-color: #a33b32;
      color: white;
    }

    [hidden] {
      display: none !important;
    }

    .page-title {
      text-align: center;
      margin: 30px 0;
      color: #713d2b;
    }

    .empty-books {
      max-width: 600px;
      margin: 50px auto 80px;
      padding: 35px 20px;
      text-align: center;
      background: rgba(255, 248, 239, 0.80);
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(48, 37, 31, 0.12);
    }

    .empty-books h3 {
      color: #713d2b;
      margin-top: 0;
    }

    .empty-books p {
      line-height: 1.6;
    }

    .contact {
      padding: 20px;
      text-align: center;
      color: white;
      text-shadow: 1px 1px 4px #30251f;
      background: rgba(48, 37, 31, 0.75);
    }

    .contact h2 {
      margin-top: 0;
    }

    .contact p {
      margin: 6px;
    }

    @media (max-width: 850px) {
      header {
        justify-content: center;
      }
    }

    @media (max-width: 650px) {
      header {
        flex-direction: column;
        padding: 15px;
      }

      .brand img {
        width: 50px;
        height: 50px;
      }

      .brand h1 {
        font-size: 20px;
      }

      nav {
        gap: 10px;
      }

      .empty-books {
        margin: 30px 12px 50px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER AND NAVIGATION -->
  <header>
    <div class="brand">
      <img src="./booknest-logo.png" alt="BookNest Logo">
      <h1>BharathiBookNest</h1>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="books.html">Books</a>
      <a href="cart.html">My Cart</a>
      <a href="#contact">Contact</a>

      <a href="index.html" class="login-btn" id="loginLink">
        Login
      </a>

      <a href="register.html" class="register-btn" id="registerLink">
        Register
      </a>

      <a href="profile.html" class="profile-btn" id="profileLink" hidden>
        My Profile
      </a>

      <a href="#" class="logout-btn" id="logoutLink" hidden>
        Logout
      </a>
    </nav>
  </header>

  <!-- PAGE TITLE -->
  <h2 class="page-title">Our Books</h2>

  <!-- EMPTY BOOKS MESSAGE -->
  <main class="empty-books">
    <h3>Books Coming Soon!</h3>
    <p>
      We are preparing new books for you.
    </p>
    <p>
      Please visit BharathiBookNest again soon!
    </p>
  </main>

  <!-- FOOTER -->
  <footer class="contact" id="contact">
    <h2>Contact BookNest</h2>
    <p>Welcome to BharathiBookNest</p>
    <p>Read, Learn and Grow!</p>
  </footer>

  <!-- SUPABASE LOGIN STATUS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    const SUPABASE_URL =
      "https://mlhveuqfxbpucorktost.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8ImFl6y1_2fsbQeAAFgFRg_RoCiGRy5";

    const loginLink = document.getElementById("loginLink");
    const registerLink = document.getElementById("registerLink");
    const profileLink = document.getElementById("profileLink");
    const logoutLink = document.getElementById("logoutLink");

    function showLoggedOutNavbar() {
      loginLink.hidden = false;
      registerLink.hidden = false;
      profileLink.hidden = true;
      logoutLink.hidden = true;
    }

    function updateNavbar(session) {
      const loggedIn = Boolean(session && session.user);

      loginLink.hidden = loggedIn;
      registerLink.hidden = loggedIn;
      profileLink.hidden = !loggedIn;
      logoutLink.hidden = !loggedIn;
    }

    async function initializeAuth() {
      if (
        !window.supabase ||
        SUPABASE_PUBLISHABLE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
      ) {
        console.warn(
          "Add your Supabase publishable key to enable login status."
        );
        showLoggedOutNavbar();
        return;
      }

      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      const { data, error } = await client.auth.getSession();

      if (error) {
        console.error("Unable to check login status:", error);
        showLoggedOutNavbar();
        return;
      }

      updateNavbar(data.session);

      client.auth.onAuthStateChange((_event, session) => {
        updateNavbar(session);
      });

      logoutLink.addEventListener("click", async function (event) {
        event.preventDefault();

        const { error } = await client.auth.signOut();

        if (error) {
          alert("Unable to log out. Please try again.");
          console.error(error);
          return;
        }

        window.location.replace("index.html");
      });
    }

    initializeAuth();
  </script>

</body>
</html>
