
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile | BookNest</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #243b64;
    }

    header {
      background: #243b64;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header a {
      color: white;
      text-decoration: none;
      margin-left: 14px;
    }

    header a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 760px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px #00000010;
    }

    #avatar {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: 10px auto;
      background: #e3e9f5;
    }

    .photo {
      text-align: center;
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 8px 0;
    }

    input {
      width: 100%;
      padding: 11px;
      margin-bottom: 12px;
      border: 1px solid #ccd2dd;
      border-radius: 6px;
      font-size: 15px;
    }

    input[readonly] {
      background: #f0f2f7;
      color: #555;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      background: #243b64;
      color: white;
      cursor: pointer;
      margin: 5px 4px 5px 0;
    }

    button:hover {
      background: #36558b;
    }

    #message {
      min-height: 20px;
      overflow-wrap: anywhere;
    }

    .order {
      padding: 12px 0;
      border-top: 1px solid #ddd;
    }

    .empty {
      color: #666;
    }

    @media (max-width: 550px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        padding: 16px 5%;
      }

      header a {
        margin-left: 8px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <strong>📚 BookNest</strong>

  <nav>
    <a href="index.html">Home</a>
    <a href="books.html">Books</a>
    <a href="cart.html">Cart</a>
    <a href="profile.html">My Profile</a>
  </nav>
</header>

<main>
  <section class="card">
    <h1>My Profile</h1>

    <div class="photo">
      <img
        id="avatar"
        alt="Profile photo"
        src="https://placehold.co/110x110?text=Profile"
      >

      <label for="photo">
        Profile photo (JPG, PNG or WEBP, max 2 MB)
      </label>

      <input
        id="photo"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

      <button type="button" id="upload">
        Upload Photo
      </button>
    </div>

    <form id="profileForm">
      <div class="grid">

        <div>
          <label for="name">Full Name</label>
          <input
            id="name"
            type="text"
            required
            minlength="2"
            maxlength="80"
          >
        </div>

        <div>
          <label for="phone">Phone Number</label>
          <input
            id="phone"
            type="tel"
            readonly
          >
        </div>

        <div>
          <label for="city">City</label>
          <input id="city" maxlength="200">
        </div>

        <div>
          <label for="state">State</label>
          <input id="state" maxlength="200">
        </div>

        <div>
          <label for="pincode">PIN Code</label>
          <input id="pincode" maxlength="200">
        </div>

      </div>

      <label for="address">Delivery Address</label>
      <input id="address" maxlength="200">

      <button type="submit">Save Profile</button>
      <button type="button" id="logout">Log Out</button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="card">
    <h2>My Orders</h2>
    <div id="orders">Loading orders...</div>
  </section>
</main>

<script>
  const message = document.getElementById("message");

  async function api(url, options = {}) {
    const response = await fetch(url, {
      credentials: "same-origin",
      ...options
    });

    const data = await response.json().catch(() => ({}));

    if (response.status === 401) {
      window.location.href = "login.html";
      throw new Error("Please log in to continue.");
    }

    if (!response.ok) {
      throw new Error(data.message || "Request failed.");
    }

    return data;
  }

  async function loadProfile() {
    try {
      const result = await api("/api/profile");
      const user = result.user;

      if (!user) {
        throw new Error("Profile details could not be loaded.");
      }

      document.getElementById("name").value = user.name || "";
      document.getElementById("phone").value = user.phone || "";
      document.getElementById("address").value = user.address || "";
      document.getElementById("city").value = user.city || "";
      document.getElementById("state").value = user.state || "";
      document.getElementById("pincode").value = user.pincode || "";

      if (user.profile_photo) {
        document.getElementById("avatar").src = user.profile_photo;
      }
    } catch (error) {
      message.textContent = error.message;
    }
  }

  document.getElementById("profileForm").addEventListener(
    "submit",
    async function(event) {
      event.preventDefault();
      message.textContent = "Saving profile...";

      const profile = {
        name: document.getElementById("name").value.trim(),
        address: document.getElementById("address").value.trim(),
        city: document.getElementById("city").value.trim(),
        state: document.getElementById("state").value.trim(),
        pincode: document.getElementById("pincode").value.trim()
      };

      try {
        const result = await api("/api/profile", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(profile)
        });

        message.textContent = result.message || "Profile saved successfully.";
      } catch (error) {
        message.textContent = error.message;
      }
    }
  );

  document.getElementById("upload").addEventListener(
    "click",
    async function() {
      const file = document.getElementById("photo").files[0];

      if (!file) {
        message.textContent = "Please select a photo first.";
        return;
      }

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      if (!allowedTypes.includes(file.type)) {
        message.textContent = "Please select a JPG, PNG or WEBP image.";
        return;
      }

      if (file.size > 2 * 1024 * 1024) {
        message.textContent = "Photo must be 2 MB or smaller.";
        return;
      }

      const formData = new FormData();
      formData.append("photo", file);

      message.textContent = "Uploading photo...";

      try {
        const result = await api("/api/profile/photo", {
          method: "POST",
          body: formData
        });

        if (result.profilePhoto) {
          document.getElementById("avatar").src =
            result.profilePhoto + "?t=" + Date.now();
        }

        message.textContent = result.message || "Photo uploaded successfully.";
      } catch (error) {
        message.textContent = error.message;
      }
    }
  );

  async function loadOrders() {
    const target = document.getElementById("orders");

    try {
      const result = await api("/api/orders");
      const orders = result.orders || [];

      target.replaceChildren();

      if (orders.length === 0) {
        target.textContent = "No orders yet.";
        target.className = "empty";
        return;
      }

      target.className = "";

      orders.forEach(function(order) {
        const item = document.createElement("div");
        item.className = "order";

        const heading = document.createElement("strong");
        heading.textContent = "Order #" + order.id;

        const details = document.createElement("p");
        details.textContent =
          "Total: " + Number(order.total).toFixed(2) +
          " | Status: " + (order.status || "Pending");

        item.append(heading, details);
        target.appendChild(item);
      });
    } catch (error) {
      target.textContent = error.message;
    }
  }

  document.getElementById("logout").addEventListener(
    "click",
    async function() {
      message.textContent = "Logging out...";

      try {
        await api("/api/logout", {
          method: "POST"
        });

        window.location.href = "login.html";
      } catch (error) {
        message.textContent = error.message;
      }
    }
  );

  loadProfile();
  loadOrders();
</script>

</body>
</html>
