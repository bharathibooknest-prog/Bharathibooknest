
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharathiBookNest - Home</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #30251f;
      min-height: 100vh;
      background-image:
        linear-gradient(
          rgba(255, 248, 239, 0.15),
          rgba(255, 248, 239, 0.15)
        ),
        url("./bharathiyar-background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      padding: 12px 30px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .brand h1 {
      font-size: 24px;
      margin: 0;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    nav a {
      color: #30251f;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }

    nav a:hover {
      color: #a45a31;
      text-decoration: underline;
    }

    nav a.login-btn,
    nav a.register-btn,
    nav a.profile-btn,
    nav a.logout-btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    nav a.login-btn {
      background-color: #d8b48a;
      color: #30251f;
      border: 1px solid #8b4513;
      cursor: pointer;
    }

    nav a.login-btn:hover {
      background-color: #c49a6c;
      color: #30251f;
      text-decoration: none;
    }

    nav a.register-btn {
      background-color: #8b4513;
      color: white;
    }

    nav a.register-btn:hover {
      background-color: #5c2e0b;
      color: white;
      text-decoration: none;
    }

    nav a.profile-btn {
      background-color: #315b42;
      color: white;
    }

    nav a.profile-btn:hover {
      background-color: #23432f;
      color: white;
      text-decoration: none;
    }

    nav a.logout-btn {
      background-color: #a33b32;
      color: white;
      cursor: pointer;
    }

    nav a.logout-btn:hover {
      background-color: #7d2923;
      color: white;
      text-decoration: none;
    }

    [hidden] {
      display: none !important;
    }

    /* Login popup */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.65);
    }

    .modal-content {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: #fff8ef;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .modal-content h2 {
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
      color: #713d2b;
    }

    .modal-content .description {
      text-align: center;
      margin-bottom: 20px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      border: none;
      background: transparent;
      color: #30251f;
      font-size: 28px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bca58e;
      border-radius: 6px;
      font-size: 16px;
    }

    .form-group input:focus {
      outline: 2px solid #8b4513;
      outline-offset: 1px;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #8b4513;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #5c2e0b;
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .form-message {
      margin-top: 15px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .form-message:empty {
      display: none;
    }

    .signup-text {
      margin-top: 20px;
      text-align: center;
    }

    .signup-text a {
      color: #8b4513;
      font-weight: bold;
    }

    .contact {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px;
      text-align: center;
      color: white;
      text-shadow: 1px 1px 4px #30251f;
      background: rgba(48, 37, 31, 0.35);
    }

    .contact h2 {
      margin-bottom: 8px;
    }

    .contact p {
      margin: 5px;
    }

    @media (max-width: 850px) {
      header {
        flex-direction: column;
        gap: 15px;
        padding: 15px;
      }

      nav {
        gap: 15px;
      }
    }

    @media (max-width: 500px) {
      .brand img {
        width: 50px;
        height: 50px;
      }

      .brand h1 {
        font-size: 19px;
      }

      nav {
        gap: 10px;
      }

      nav a.login-btn,
      nav a.register-btn,
      nav a.profile-btn,
      nav a.logout-btn {
        padding: 9px 12px;
      }

      .modal-content {
        padding: 25px 20px;
      }

      .contact {
        position: relative;
        margin-top: 80px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <img src="./booknest-logo.png" alt="BookNest Logo">
      <h1>BharathiBookNest</h1>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="books.html">Books</a>
      <a href="cart.html">My Cart</a>
      <a href="index.html#contact">Contact</a>

      <a href="#" class="login-btn" id="loginLink">
        Login
      </a>

      <a href="register.html" class="register-btn" id="registerLink">
        Sign Up
      </a>

      <a href="profile.html" class="profile-btn" id="profileLink" hidden>
        My Profile
      </a>

      <a href="#" class="logout-btn" id="logoutLink" hidden>
        Logout
      </a>
    </nav>
  </header>

  <!-- Login popup -->
  <div
    class="modal"
    id="loginModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="loginTitle"
    hidden
  >
    <div class="modal-content">
      <button
        type="button"
        class="close-btn"
        id="closeLogin"
        aria-label="Close login"
      >&times;</button>

      <h2 id="loginTitle">Welcome Back!</h2>
      <p class="description">Login to your BharathiBookNest account.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="submit-btn" id="loginSubmit">
          Login
        </button>

        <p
          class="form-message"
          id="loginMessage"
          role="status"
          aria-live="polite"
        ></p>
      </form>

      <p class="signup-text">
        Don't have an account?
        <a href="register.html">Sign Up</a>
      </p>
    </div>
  </div>

  <section class="contact" id="contact">
    <h2>Contact BookNest</h2>
    <p>Email: bharathibooknest@gmail.com</p>
    <p>Online Book Store</p>
  </section>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    // Supabase project connection
    const SUPABASE_URL =
      "https://mlhveuqfxbpucorktost.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8ImFl6y1_2fsbQeAAFgFRg_RoCiGRy5";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    // Navigation elements
    const loginLink = document.getElementById("loginLink");
    const registerLink = document.getElementById("registerLink");
    const profileLink = document.getElementById("profileLink");
    const logoutLink = document.getElementById("logoutLink");

    // Login popup elements
    const loginModal = document.getElementById("loginModal");
    const closeLogin = document.getElementById("closeLogin");
    const loginForm = document.getElementById("loginForm");
    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const loginSubmit = document.getElementById("loginSubmit");
    const loginMessage = document.getElementById("loginMessage");

    // Show or hide navigation based on session
    function updateNavbar(isLoggedIn) {
      loginLink.hidden = isLoggedIn;
      registerLink.hidden = isLoggedIn;
      profileLink.hidden = !isLoggedIn;
      logoutLink.hidden = !isLoggedIn;

      if (isLoggedIn) {
        loginModal.hidden = true;
      }
    }

    // Open login popup
    loginLink.addEventListener("click", function(event) {
      event.preventDefault();

      loginMessage.textContent = "";
      loginModal.hidden = false;
      loginEmail.focus();
    });

    // Close popup
    function closeLoginModal() {
      loginModal.hidden = true;
      loginMessage.textContent = "";
      loginLink.focus();
    }

    closeLogin.addEventListener("click", closeLoginModal);

    // Close when clicking outside the form
    loginModal.addEventListener("click", function(event) {
      if (event.target === loginModal) {
        closeLoginModal();
      }
    });

    // Close popup with Escape key
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape" && !loginModal.hidden) {
        closeLoginModal();
      }
    });

    // Login using Supabase email and password
    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      loginSubmit.disabled = true;
      loginSubmit.textContent = "Logging in...";
      loginMessage.textContent = "";

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: loginEmail.value.trim(),
            password: loginPassword.value
          });

        if (error) {
          throw error;
        }

        if (!data.session) {
          loginMessage.textContent =
            "Login was not completed. Please try again.";
          return;
        }

        loginMessage.textContent = "Login successful!";

        updateNavbar(true);
        loginForm.reset();

        // Stay on the homepage after successful login.
        loginModal.hidden = true;

      } catch (error) {
        console.error("Login failed:", error.message);

        loginMessage.textContent =
          error.message === "Invalid login credentials"
            ? "Incorrect email or password. Please try again."
            : error.message;
      } finally {
        loginSubmit.disabled = false;
        loginSubmit.textContent = "Login";
      }
    });

    // Check the existing Supabase session
    async function checkLoginStatus() {
      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) {
          throw error;
        }

        updateNavbar(Boolean(data.session));

      } catch (error) {
        console.error("Unable to check login status:", error.message);
        updateNavbar(false);
      }
    }

    // Keep the navbar synchronized with Supabase
    supabaseClient.auth.onAuthStateChange(
      function(event, session) {
        updateNavbar(Boolean(session));
      }
    );

    // Logout
    logoutLink.addEventListener("click", async function(event) {
      event.preventDefault();

      logoutLink.style.pointerEvents = "none";

      try {
        const { error } =
          await supabaseClient.auth.signOut();

        if (error) {
          throw error;
        }

        updateNavbar(false);
        window.location.href = "index.html";

      } catch (error) {
        console.error("Logout failed:", error.message);
        alert("Logout failed. Please try again.");
      } finally {
        logoutLink.style.pointerEvents = "";
      }
    });

    // Initialize navigation
    checkLoginStatus();
  </script>
</body>
</html>
