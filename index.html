
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharathiBookNest - Home</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #30251f;
      min-height: 100vh;
      background-image:
        linear-gradient(
          rgba(255, 248, 239, 0.15),
          rgba(255, 248, 239, 0.15)
        ),
        url("./bharathiyar-background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      padding: 12px 30px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .brand h1 {
      font-size: 24px;
      margin: 0;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    nav a {
      color: #30251f;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }

    nav a:hover {
      color: #a45a31;
      text-decoration: underline;
    }

    nav a.login-btn,
    nav a.register-btn,
    nav a.profile-btn,
    nav a.logout-btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    nav a.login-btn {
      background-color: #d8b48a;
      color: #30251f;
      border: 1px solid #8b4513;
    }

    nav a.login-btn:hover {
      background-color: #c49a6c;
      color: #30251f;
      text-decoration: none;
    }

    nav a.register-btn {
      background-color: #8b4513;
      color: white;
    }

    nav a.register-btn:hover {
      background-color: #5c2e0b;
      color: white;
      text-decoration: none;
    }

    nav a.profile-btn {
      background-color: #315b42;
      color: white;
    }

    nav a.profile-btn:hover {
      background-color: #23432f;
      color: white;
      text-decoration: none;
    }

    nav a.logout-btn {
      background-color: #a33b32;
      color: white;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: bold;
    }

    nav a.logout-btn:hover {
      background-color: #7d2923;
      color: white;
      text-decoration: none;
    }

    [hidden] {
      display: none !important;
    }

    .contact {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px;
      text-align: center;
      color: white;
      text-shadow: 1px 1px 4px #30251f;
      background: rgba(48, 37, 31, 0.35);
    }

    .contact h2 {
      margin-bottom: 8px;
    }

    .contact p {
      margin: 5px;
    }

    @media (max-width: 850px) {
      header {
        flex-direction: column;
        gap: 15px;
        padding: 15px;
      }

      nav {
        gap: 15px;
      }
    }

    @media (max-width: 500px) {
      .brand img {
        width: 50px;
        height: 50px;
      }

      .brand h1 {
        font-size: 19px;
      }

      nav {
        gap: 10px;
      }

      nav a.login-btn,
      nav a.register-btn,
      nav a.profile-btn,
      nav a.logout-btn {
        padding: 9px 12px;
      }

      .contact {
        position: relative;
        margin-top: 80px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <img src="./booknest-logo.png" alt="BookNest Logo">
      <h1>BharathiBookNest</h1>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="books.html">Books</a>
      <a href="cart.html">My Cart</a>
      <a href="contact">Contact</a>

      <a href="login.html" class="login-btn" id="loginLink">
        Login
      </a>

      <a href="register.html" class="register-btn" id="registerLink">
        Sign Up
      </a>

      <a href="profile.html" class="profile-btn" id="profileLink" hidden>
        My Profile
      </a>

      <a href="#" class="logout-btn" id="logoutLink" hidden>
        Logout
      </a>
    </nav>
  </header>

  <section class="contact" id="contact">
    <h2>Contact BookNest</h2>
    <p>Email: bharathibooknest@gmail.com</p>
    <p>Online Book Store</p>
  </section>

  <!-- Supabase JavaScript library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    // Supabase project connection
    const SUPABASE_URL =
      "https://mlhveuqfxbpucorktost.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8ImFl6y1_2fsbQeAAFgFRg_RoCiGRy5";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    // Navigation elements
    const loginLink = document.getElementById("loginLink");
    const registerLink = document.getElementById("registerLink");
    const profileLink = document.getElementById("profileLink");
    const logoutLink = document.getElementById("logoutLink");

    // Show navigation based on authentication status
    function updateNavbar(isLoggedIn) {
      loginLink.hidden = isLoggedIn;
      registerLink.hidden = isLoggedIn;
      profileLink.hidden = !isLoggedIn;
      logoutLink.hidden = !isLoggedIn;
    }

    // Check the current Supabase session
    async function checkLoginStatus() {
      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) {
          throw error;
        }

        updateNavbar(Boolean(data.session));

      } catch (error) {
        console.error("Unable to check login status:", error.message);
        updateNavbar(false);
      }
    }

    // Listen for login, logout, and other auth changes
    supabaseClient.auth.onAuthStateChange(
      (event, session) => {
        updateNavbar(Boolean(session));
      }
    );

    // Logout the current user
    logoutLink.addEventListener("click", async function(event) {
      event.preventDefault();

      logoutLink.style.pointerEvents = "none";

      try {
        const { error } =
          await supabaseClient.auth.signOut();

        if (error) {
          throw error;
        }

        updateNavbar(false);
        window.location.href = "index.html";

      } catch (error) {
        console.error("Logout failed:", error.message);
        alert("Logout failed. Please try again.");
      } finally {
        logoutLink.style.pointerEvents = "";
      }
    });

    // Run when the homepage opens
    checkLoginStatus();
  </script>
</body>
</html>
