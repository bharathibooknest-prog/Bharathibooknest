
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharathiBookNest - My Cart</title>

  <style>
    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #30251f;
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(255,248,239,.15), rgba(255,248,239,.15)),
        url("./bharathiyar-background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      padding: 12px 30px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .brand h1 { font-size: 24px; margin: 0; }

    nav, .auth-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    nav a {
      color: #30251f;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }

    nav a:hover {
      color: #a45a31;
      text-decoration: underline;
    }

    .auth-btn {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid #713d2b;
      cursor: pointer;
      font-size: 14px;
    }

    .login-btn { background: #fff8ef; color: #713d2b; }
    .register-btn { background: #713d2b; color: white; }
    .profile-btn { background: #315b42; color: white; }
    .logout-btn { background: #a33b32; color: white; }

    /* Hide authentication controls until session check finishes. */
    .auth-buttons { visibility: hidden; }
    .auth-buttons.ready { visibility: visible; }

    .cart-container {
      max-width: 1000px;
      margin: 35px auto;
      padding: 25px;
      background: rgba(255,255,255,.94);
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000018;
    }

    h2 {
      text-align: center;
      margin: 0 0 25px;
      color: #713d2b;
      font-size: 28px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      width: 100%;
      padding: 18px 20px;
      margin-bottom: 14px;
      background: #fffaf5;
      border: 1px solid #ead6c2;
      border-radius: 8px;
    }

    .book-details { flex: 1; min-width: 0; text-align: left; }

    .book-name {
      margin: 0 0 8px;
      color: #713d2b;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .book-description {
      margin: 0;
      color: #6b5b50;
      font-size: 14px;
    }

    .cart-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      flex-shrink: 0;
    }

    .book-price {
      min-width: 110px;
      text-align: right;
      font-size: 17px;
      font-weight: bold;
      color: #315b42;
    }

    .remove-btn {
      background: #a33b32;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .remove-btn:hover { background: #7d2923; }

    #empty {
      text-align: center;
      color: #6b5b50;
      padding: 25px 10px;
      font-size: 17px;
    }

    #total {
      text-align: right;
      font-size: 23px;
      font-weight: bold;
      color: #713d2b;
      margin-top: 25px;
      padding-top: 18px;
      border-top: 2px solid #ead6c2;
    }

    .cart-footer-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .continue-shopping, .checkout-btn {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      text-align: center;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .continue-shopping { background: #713d2b; color: white; }
    .continue-shopping:hover { background: #512b1f; }
    .checkout-btn { background: #315b42; color: white; }
    .checkout-btn:hover { background: #23432f; }
    .checkout-btn:disabled { background: #999; cursor: not-allowed; }

    footer {
      margin-top: 40px;
      padding: 18px;
      background: rgba(113,61,43,.96);
      color: white;
      text-align: center;
    }

    footer p { margin: 5px; }

    @media (max-width: 700px) {
      header { flex-direction: column; padding: 15px; }
      .brand img { width: 50px; height: 50px; }
      .brand h1 { font-size: 21px; }
      nav { gap: 14px; }
      .auth-buttons { width: 100%; }

      .cart-container {
        margin: 20px 12px;
        padding: 18px 12px;
      }

      .cart-item {
        align-items: stretch;
        flex-direction: column;
        gap: 15px;
        padding: 15px;
      }

      .cart-actions {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .book-price { text-align: left; min-width: 0; }
      #total { font-size: 20px; }
      .cart-footer-actions { flex-direction: column; }

      .continue-shopping, .checkout-btn { width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <img src="./booknest-logo.png" alt="BharathiBookNest Logo">
      <h1>BharathiBookNest</h1>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="books.html">Books</a>
      <a href="cart.html">My Cart</a>
      <a href="#contact">Contact</a>
    </nav>

    <div class="auth-buttons" id="authButtons">
      <a href="index.html" class="auth-btn login-btn" id="loginLink">
        Login
      </a>

      <a href="register.html" class="auth-btn register-btn" id="registerLink">
        Register
      </a>

      <a href="profile.html" class="auth-btn profile-btn"
         id="profileLink" hidden>
        My Profile
      </a>

      <button type="button" class="auth-btn logout-btn"
              id="logoutButton" hidden>
        Logout
      </button>
    </div>
  </header>

  <main class="cart-container">
    <h2>🛒 My Cart</h2>
    <div id="cartItems"></div>
    <p id="empty">Your cart is empty.</p>
    <p id="total">Total: ₹0</p>

    <div class="cart-footer-actions">
      <a href="books.html" class="continue-shopping">
        Continue Shopping
      </a>

      <button type="button" class="checkout-btn"
              id="checkoutBtn" disabled>
        Proceed to Checkout →
      </button>
    </div>
  </main>

  <footer id="contact">
    <p>📚 BharathiBookNest - Your Online Book Store</p>
    <p>&copy; 2026 BharathiBookNest. All rights reserved.</p>
    <p>Contact: bharathibooknest@gmail.com</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    "use strict";

    const SUPABASE_URL =
      "https://mlhveuqfxbpucorktost.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8ImFl6y1_2fsbQeAAFgFRg_RoCiGRy5";

    const authButtons = document.getElementById("authButtons");
    const loginLink = document.getElementById("loginLink");
    const registerLink = document.getElementById("registerLink");
    const profileLink = document.getElementById("profileLink");
    const logoutButton = document.getElementById("logoutButton");

    let supabaseClient = null;

    function updateNavbar(session) {
      const loggedIn = Boolean(session && session.user);

      loginLink.hidden = loggedIn;
      registerLink.hidden = loggedIn;
      profileLink.hidden = !loggedIn;
      logoutButton.hidden = !loggedIn;

      authButtons.classList.add("ready");
    }

    // Initialize the same Supabase project used by Home and Register.
    function initializeSupabase() {
      if (
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
      ) {
        console.error("Supabase SDK did not load.");
        updateNavbar(null);
        return false;
      }

      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

      return true;
    }

    // CART FUNCTIONS
    function getCart() {
      try {
        const data = JSON.parse(
          localStorage.getItem("booknestCart") || "[]"
        );

        if (!Array.isArray(data)) return [];

        return data.filter(book =>
          book &&
          typeof book.name === "string" &&
          Number.isFinite(Number(book.price)) &&
          Number(book.price) >= 0
        );
      } catch (error) {
        console.error("Unable to read cart:", error);
        return [];
      }
    }

    function saveCart(cart) {
      try {
        localStorage.setItem("booknestCart", JSON.stringify(cart));
        return true;
      } catch (error) {
        console.error("Unable to save cart:", error);
        alert("Unable to update your cart.");
        return false;
      }
    }

    function displayCart() {
      const cart = getCart();
      const container = document.getElementById("cartItems");
      const empty = document.getElementById("empty");
      const totalElement = document.getElementById("total");
      const checkoutBtn = document.getElementById("checkoutBtn");

      container.replaceChildren();

      let total = 0;
      empty.hidden = cart.length > 0;
      checkoutBtn.disabled = cart.length === 0;

      cart.forEach((book, index) => {
        const price = Number(book.price);
        const quantity = Math.max(
          1,
          Number.parseInt(book.quantity, 10) || 1
        );

        total += price * quantity;

        const item = document.createElement("div");
        item.className = "cart-item";

        const details = document.createElement("div");
        details.className = "book-details";

        const name = document.createElement("h3");
        name.className = "book-name";
        name.textContent = book.name;

        const description = document.createElement("p");
        description.className = "book-description";
        description.textContent = "Book from BharathiBookNest";

        details.append(name, description);

        const actions = document.createElement("div");
        actions.className = "cart-actions";

        const priceElement = document.createElement("span");
        priceElement.className = "book-price";
        priceElement.textContent =
          "₹" + (price * quantity).toLocaleString("en-IN");

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "remove-btn";
        removeButton.textContent = "Remove";
        removeButton.addEventListener("click", () => removeBook(index));

        actions.append(priceElement, removeButton);
        item.append(details, actions);
        container.appendChild(item);
      });

      totalElement.textContent =
        "Total: ₹" + total.toLocaleString("en-IN");
    }

    function removeBook(index) {
      const cart = getCart();
      if (index < 0 || index >= cart.length) return;

      cart.splice(index, 1);
      if (saveCart(cart)) displayCart();
    }

    // AUTH SESSION
    async function initializeAuth() {
      if (!initializeSupabase()) return;

      // Subscribe before reading the initial session.
      supabaseClient.auth.onAuthStateChange((_event, session) => {
        updateNavbar(session);
      });

      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) {
          console.error("Session check failed:", error.message);
          updateNavbar(null);
          return;
        }

        updateNavbar(data.session);
      } catch (error) {
        console.error("Could not initialize authentication:", error);
        updateNavbar(null);
      }
    }

    // LOGOUT
    logoutButton.addEventListener("click", async function() {
      if (!supabaseClient) return;

      logoutButton.disabled = true;
      logoutButton.textContent = "Logging out...";

      try {
        const { error } = await supabaseClient.auth.signOut();

        if (error) {
          console.error("Logout failed:", error.message);
          alert("Logout failed. Please try again.");
          logoutButton.disabled = false;
          logoutButton.textContent = "Logout";
          return;
        }

        window.location.replace("index.html");
      } catch (error) {
        console.error("Logout failed:", error);
        alert("Unable to log out. Please try again.");
        logoutButton.disabled = false;
        logoutButton.textContent = "Logout";
      }
    });

    // CHECKOUT
    document.getElementById("checkoutBtn").addEventListener(
      "click",
      async function() {
        if (getCart().length === 0) {
          alert("Your cart is empty. Add books before checkout.");
          return;
        }

        if (!supabaseClient) {
          alert("Login service is unavailable. Please try again later.");
          return;
        }

        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error || !data.session) {
          alert("Please log in before checkout.");
          window.location.href = "index.html";
          return;
        }

        alert(
          "You are logged in. Online ordering and payment are not configured yet."
        );
      }
    );

    displayCart();
    initializeAuth();

    window.addEventListener("storage", event => {
      if (event.key === "booknestCart") displayCart();
    });
  </script>
</body>
</html>
