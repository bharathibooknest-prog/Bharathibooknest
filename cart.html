<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - My Cart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #30251f;
      min-height: 100vh;
      background-image:
        linear-gradient(
          rgba(255, 248, 239, 0.15),
          rgba(255, 248, 239, 0.15)
        ),
        url("./bharathiyar-background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      padding: 12px 30px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .brand h1 {
      font-size: 24px;
      margin: 0;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    nav a {
      color: #30251f;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }

    nav a:hover {
      color: #a45a31;
      text-decoration: underline;
    }

    .auth-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .auth-btn {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid #713d2b;
      cursor: pointer;
    }

    .login-btn {
      background: #fff8ef;
      color: #713d2b;
    }

    .register-btn {
      background: #713d2b;
      color: white;
    }

    .profile-btn {
      background: #315b42;
      color: white;
    }

    .logout-btn {
      background: #a33b32;
      color: white;
    }

    [hidden] {
      display: none !important;
    }

    /* CART CONTAINER */
    .cart-container {
      max-width: 1000px;
      margin: 35px auto;
      padding: 25px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000018;
    }

    h2 {
      text-align: center;
      margin: 0 0 25px;
      color: #713d2b;
      font-size: 28px;
    }

    /* CART ITEMS */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      width: 100%;
      padding: 18px 20px;
      margin-bottom: 14px;
      background: #fffaf5;
      border: 1px solid #ead6c2;
      border-radius: 8px;
    }

    .book-details {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .book-name {
      margin: 0 0 8px;
      color: #713d2b;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .book-description {
      margin: 0;
      color: #6b5b50;
      font-size: 14px;
    }

    .cart-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      flex-shrink: 0;
    }

    .book-price {
      min-width: 110px;
      text-align: right;
      font-size: 17px;
      font-weight: bold;
      color: #315b42;
    }

    .remove-btn {
      background: #a33b32;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .remove-btn:hover {
      background: #7d2923;
    }

    /* EMPTY CART */
    #empty {
      text-align: center;
      color: #6b5b50;
      padding: 25px 10px;
      font-size: 17px;
    }

    /* TOTAL */
    #total {
      text-align: right;
      font-size: 23px;
      font-weight: bold;
      color: #713d2b;
      margin-top: 25px;
      padding-top: 18px;
      border-top: 2px solid #ead6c2;
    }

    /* CART BUTTONS */
    .cart-footer-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .continue-shopping,
    .checkout-btn {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      text-align: center;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .continue-shopping {
      background: #713d2b;
      color: white;
    }

    .continue-shopping:hover {
      background: #512b1f;
    }

    .checkout-btn {
      background: #315b42;
      color: white;
    }

    .checkout-btn:hover {
      background: #23432f;
    }

    .checkout-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    /* FOOTER */
    footer {
      margin-top: 40px;
      padding: 18px;
      background: rgba(113, 61, 43, 0.96);
      color: white;
      text-align: center;
    }

    footer p {
      margin: 5px;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 700px) {
      header {
        flex-direction: column;
        padding: 15px;
      }

      .brand img {
        width: 50px;
        height: 50px;
      }

      .brand h1 {
        font-size: 21px;
      }

      nav {
        gap: 14px;
      }

      .auth-buttons {
        width: 100%;
      }

      .cart-container {
        margin: 20px 12px;
        padding: 18px 12px;
      }

      .cart-item {
        align-items: stretch;
        flex-direction: column;
        gap: 15px;
        padding: 15px;
      }

      .cart-actions {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .book-price {
        text-align: left;
        min-width: 0;
      }

      #total {
        font-size: 20px;
      }

      .cart-footer-actions {
        flex-direction: column;
      }

      .continue-shopping,
      .checkout-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <img src="./booknest-logo.png" alt="BookNest Logo">
      <h1>BharathiBookNest</h1>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="books.html">Books</a>
      <a href="cart.html">My Cart</a>
      <a href="#contact">Contact</a>
    </nav>

    <div class="auth-buttons">
      <a href="login.html"
         class="auth-btn login-btn"
         id="loginLink">
        Login
      </a>

      <a href="register.html"
         class="auth-btn register-btn"
         id="registerLink">
        Register
      </a>

      <a href="profile.html"
         class="auth-btn profile-btn"
         id="profileLink"
         hidden>
        My Profile
      </a>

      <button type="button"
              class="auth-btn logout-btn"
              id="logoutButton"
              hidden>
        Logout
      </button>
    </div>
  </header>

  <!-- CART -->
  <main class="cart-container">
    <h2>🛒 My Cart</h2>

    <div id="cartItems"></div>

    <p id="empty">Your cart is empty.</p>

    <p id="total">Total: ₹0</p>

    <div class="cart-footer-actions">
      <a href="books.html" class="continue-shopping">
        Continue Shopping
      </a>

      <button
        type="button"
        class="checkout-btn"
        id="checkoutBtn"
        disabled
      >
        Proceed to Checkout →
      </button>
    </div>
  </main>

  <!-- FOOTER -->
  <footer id="contact">
    <p>📚 BookNest - Your Online Book Store</p>
    <p>&copy; 2026 BookNest. All rights reserved.</p>
  </footer>

  <script>
    "use strict";

    /* READ CART */
    function getCart() {
      try {
        const data = JSON.parse(
          localStorage.getItem("booknestCart") || "[]"
        );

        if (!Array.isArray(data)) {
          return [];
        }

        return data.filter(book =>
          book &&
          typeof book.name === "string" &&
          Number.isFinite(Number(book.price)) &&
          Number(book.price) >= 0
        );
      } catch (error) {
        console.error("Unable to read cart:", error);
        return [];
      }
    }

    /* SAVE CART */
    function saveCart(cart) {
      try {
        localStorage.setItem(
          "booknestCart",
          JSON.stringify(cart)
        );
        return true;
      } catch (error) {
        console.error("Unable to save cart:", error);
        alert("Unable to update your cart.");
        return false;
      }
    }

    /* DISPLAY CART */
    function displayCart() {
      const cart = getCart();
      const container = document.getElementById("cartItems");
      const empty = document.getElementById("empty");
      const totalElement = document.getElementById("total");
      const checkoutBtn = document.getElementById("checkoutBtn");

      container.replaceChildren();

      let total = 0;

      empty.hidden = cart.length > 0;
      checkoutBtn.disabled = cart.length === 0;

      cart.forEach((book, index) => {
        const price = Number(book.price);
        const quantity = Math.max(
          1,
          Number.parseInt(book.quantity, 10) || 1
        );

        total += price * quantity;

        const item = document.createElement("div");
        item.className = "cart-item";

        // BOOK DETAILS
        const details = document.createElement("div");
        details.className = "book-details";

        const name = document.createElement("h3");
        name.className = "book-name";
        name.textContent = book.name;

        const description = document.createElement("p");
        description.className = "book-description";
        description.textContent = "Mathematics Book";

        details.append(name, description);

        // PRICE AND REMOVE BUTTON
        const actions = document.createElement("div");
        actions.className = "cart-actions";

        const priceElement = document.createElement("span");
        priceElement.className = "book-price";
        priceElement.textContent =
          "₹" + (price * quantity).toLocaleString("en-IN");

        if (quantity > 1) {
          priceElement.title =
            "₹" + price.toLocaleString("en-IN") +
            " per book × " + quantity;
        }

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "remove-btn";
        removeButton.textContent = "Remove";

        removeButton.addEventListener("click", function () {
          removeBook(index);
        });

        actions.append(priceElement, removeButton);
        item.append(details, actions);
        container.appendChild(item);
      });

      totalElement.textContent =
        "Total: ₹" + total.toLocaleString("en-IN");
    }

    /* REMOVE BOOK */
    function removeBook(index) {
      const cart = getCart();

      if (index < 0 || index >= cart.length) {
        return;
      }

      cart.splice(index, 1);

      if (saveCart(cart)) {
        displayCart();
      }
    }

    /* CHECKOUT */
    document.getElementById("checkoutBtn").addEventListener(
      "click",
      async function () {
        const cart = getCart();

        if (cart.length === 0) {
          alert("Your cart is empty. Please add books first.");
          displayCart();
          return;
        }

        // Check whether the user is logged in.
        this.disabled = true;

        try {
          const response = await fetch("/api/me", {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store"
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok || !data.user) {
            alert("Please login before checkout.");
            window.location.href = "login.html";
            return;
          }

          /*
            Checkout page should review the cart and collect
            delivery details before placing a real order.
            No payment is taken on this page.
          */
          window.location.href = "checkout.html";

        } catch (error) {
          console.error("Checkout error:", error);
          alert(
            "Unable to connect to the server. Please try again."
          );
        } finally {
          this.disabled = getCart().length === 0;
        }
      }
    );

    /* LOGIN STATUS */
    async function updateNavbar() {
      const loginLink = document.getElementById("loginLink");
      const registerLink = document.getElementById("registerLink");
      const profileLink = document.getElementById("profileLink");
      const logoutButton = document.getElementById("logoutButton");

      try {
        const response = await fetch("/api/me", {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store"
        });

        const data = await response.json().catch(() => ({}));
        const loggedIn = response.ok && Boolean(data.user);

        loginLink.hidden = loggedIn;
        registerLink.hidden = loggedIn;
        profileLink.hidden = !loggedIn;
        logoutButton.hidden = !loggedIn;

      } catch (error) {
        console.error("Login status check failed:", error);

        loginLink.hidden = false;
        registerLink.hidden = false;
        profileLink.hidden = true;
        logoutButton.hidden = true;
      }
    }

    /* LOGOUT */
    document.getElementById("logoutButton").addEventListener(
      "click",
      async function () {
        this.disabled = true;
        this.textContent = "Logging out...";

        try {
          const response = await fetch("/api/logout", {
            method: "POST",
            credentials: "same-origin"
          });

          if (!response.ok) {
            throw new Error("Logout request failed.");
          }

          window.location.replace("index.html");

        } catch (error) {
          console.error("Logout failed:", error);
          alert("Unable to log out. Please try again.");

          this.disabled = false;
          this.textContent = "Logout";
        }
      }
    );

    /* INITIALIZE PAGE */
    document.addEventListener("DOMContentLoaded", function () {
      displayCart();
      updateNavbar();
    });

    /* REFRESH WHEN CART CHANGES IN ANOTHER TAB */
    window.addEventListener("storage", function (event) {
      if (event.key === "booknestCart") {
        displayCart();
      }
    });
  </script>

</body>
</html>
