
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharathiBookNest - Register & Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f8eee3;
      color: #30251f;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 25px #0002;
    }

    h1 {
      text-align: center;
      color: #713d2b;
      font-size: 27px;
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbb8a7;
      border-radius: 6px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #b88a68;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      background: #713d2b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      line-height: 1.7;
    }

    .switch button {
      width: auto;
      margin: 0;
      padding: 0;
      background: none;
      color: #713d2b;
      text-decoration: underline;
    }

    #message {
      text-align: center;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #713d2b;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>BharathiBookNest</h1>

    <!-- REGISTER -->
    <section id="registerSection">
      <h2>Create Account</h2>

      <form id="registerForm">
        <label for="regName">Full Name</label>
        <input
          id="regName"
          type="text"
          autocomplete="name"
          minlength="2"
          maxlength="80"
          required
        >

        <label for="regEmail">Email Address</label>
        <input
          id="regEmail"
          type="email"
          autocomplete="email"
          maxlength="254"
          placeholder="you@example.com"
          required
        >

        <label for="regPassword">Create Password</label>
        <input
          id="regPassword"
          type="password"
          minlength="8"
          maxlength="128"
          autocomplete="new-password"
          required
        >

        <button type="submit" id="registerBtn">
          Sign Up
        </button>
      </form>

      <p class="switch">
        Already have an account?
        <button type="button" id="showLogin">Login</button>
      </p>
    </section>

    <!-- LOGIN -->
    <section id="loginSection" hidden>
      <h2>Login</h2>

      <form id="loginForm">
        <label for="loginEmail">Email Address</label>
        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          required
        >

        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          type="password"
          maxlength="128"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginBtn">
          Login
        </button>
      </form>

      <p class="switch">
        New to BookNest?
        <button type="button" id="showRegister">Create Account</button>
      </p>
    </section>

    <!-- EMAIL CONFIRMATION MESSAGE -->
    <section id="verifySection" hidden>
      <h2>Verify Your Email</h2>
      <p>
        Signup request received. Check your email inbox and click
        the verification link to confirm your account.
      </p>
      <p>
        Email varavillai endraal Spam/Junk folder-ai check pannu.
      </p>
      <button type="button" id="backToLogin">
        Go to Login
      </button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="back" href="index.html">Back to Home</a>
  </main>

  <script>
    "use strict";

    // Supabase connection
    const SUPABASE_URL =
      "https://mlhveuqfxbpucorktost.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8ImFl6y1_2fsbQeAAFgFRg_RoCiGRy5";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const registerSection =
      document.getElementById("registerSection");

    const loginSection =
      document.getElementById("loginSection");

    const verifySection =
      document.getElementById("verifySection");

    const message =
      document.getElementById("message");

    const registerForm =
      document.getElementById("registerForm");

    const loginForm =
      document.getElementById("loginForm");

    const registerBtn =
      document.getElementById("registerBtn");

    const loginBtn =
      document.getElementById("loginBtn");

    function showSection(section) {
      registerSection.hidden = section !== registerSection;
      loginSection.hidden = section !== loginSection;
      verifySection.hidden = section !== verifySection;
      message.textContent = "";
    }

    document.getElementById("showLogin").addEventListener(
      "click", () => showSection(loginSection)
    );

    document.getElementById("showRegister").addEventListener(
      "click", () => showSection(registerSection)
    );

    document.getElementById("backToLogin").addEventListener(
      "click", () => showSection(loginSection)
    );

    // SIGNUP + EMAIL VERIFICATION
    registerForm.addEventListener("submit", async event => {
      event.preventDefault();

      if (!registerForm.reportValidity()) return;

      const name =
        document.getElementById("regName").value.trim();

      const email =
        document.getElementById("regEmail").value.trim();

      const password =
        document.getElementById("regPassword").value;

      registerBtn.disabled = true;
      registerBtn.textContent = "Creating Account...";
      message.textContent = "Please wait...";

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: name
            },
            emailRedirectTo:
              "https://bharathibooknest-prog.github.io/Bharathibooknest/"
          }
        });

        if (error) throw error;

        if (data.session) {
          message.textContent =
            "Account created successfully! Opening BookNest...";

          window.location.href = "./index.html";
          return;
        }

        showSection(verifySection);
        message.textContent =
          "Check your email to verify your account.";

      } catch (error) {
        message.textContent =
          error.message || "Signup failed. Please try again.";
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = "Sign Up";
      }
    });

    // LOGIN
    loginForm.addEventListener("submit", async event => {
      event.preventDefault();

      if (!loginForm.reportValidity()) return;

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging In...";
      message.textContent = "Please wait...";

      try {
        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;

        if (!data.session) {
          throw new Error(
            "Login session was not created. Please try again."
          );
        }

        window.location.href = "./index.html";

      } catch (error) {
        message.textContent =
          error.message || "Login failed. Please try again.";
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });

    // Check existing session
    async function checkSession() {
      const { data, error } = await supabase.auth.getSession();

      if (!error && data.session) {
        window.location.href = "./index.html";
      }
    }

    checkSession();
  </script>
</body>
</html>
