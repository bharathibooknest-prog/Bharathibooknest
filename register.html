
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Phone Login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f8eee3;
      color: #30251f;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px #0002;
    }

    h1, h2 { text-align: center; }
    h1 { color: #713d2b; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbb8a7;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      background: #713d2b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled { opacity: 0.6; }

    .switch {
      text-align: center;
      margin-top: 18px;
    }

    .switch button {
      width: auto;
      margin: 0;
      padding: 0;
      background: none;
      color: #713d2b;
      text-decoration: underline;
    }

    #message {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #713d2b;
    }

    [hidden] { display: none !important; }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <main class="container">
    <h1>BharathiBookNest</h1>

    <section id="registerSection">
      <h2>Create Account</h2>

      <form id="registerForm">
        <label for="regName">Full Name</label>
        <input id="regName" type="text"
          minlength="2" maxlength="80"
          autocomplete="name" required>

        <label for="regPhone">Mobile Number</label>
        <input id="regPhone" type="tel"
          placeholder="+919876543210"
          pattern="\+[1-9][0-9]{7,14}"
          autocomplete="tel" required>

        <button type="submit" id="registerBtn">
          Send OTP & Register
        </button>
      </form>

      <p class="switch">
        Already registered?
        <button type="button" id="showLogin">Login</button>
      </p>
    </section>

    <section id="loginSection" hidden>
      <h2>Login</h2>

      <form id="loginForm">
        <label for="loginPhone">Mobile Number</label>
        <input id="loginPhone" type="tel"
          placeholder="+919876543210"
          pattern="\+[1-9][0-9]{7,14}"
          autocomplete="tel" required>

        <button type="submit" id="loginBtn">
          Send Login OTP
        </button>
      </form>

      <p class="switch">
        New to BookNest?
        <button type="button" id="showRegister">Register</button>
      </p>
    </section>

    <section id="otpSection" hidden>
      <h2>Verify OTP</h2>
      <p>Enter the verification code sent to your phone.</p>

      <form id="otpForm">
        <label for="otp">SMS verification code</label>
        <input id="otp" type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="10" required>

        <button type="submit" id="verifyBtn">
          Verify & Continue
        </button>
      </form>

      <button type="button" id="backBtn">
        Back
      </button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
    <a class="back" href="index.html">Back to Home</a>
  </main>

  <script type="module">
"use strict";

const SUPABASE_URL =
  "https://mlhveuqfxbpucorktost.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_8ImFl6y1_2fsbQeAAFgFRg_RoCiGRy5";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const registerSection =
  document.getElementById("registerSection");

const loginSection =
  document.getElementById("loginSection");

const message = document.getElementById("message");

const registerForm =
  document.getElementById("registerForm");

const loginForm =
  document.getElementById("loginForm");

document.getElementById("showLogin").onclick = function () {
  registerSection.hidden = true;
  loginSection.hidden = false;
  message.textContent = "";
};

document.getElementById("showRegister").onclick = function () {
  loginSection.hidden = true;
  registerSection.hidden = false;
  message.textContent = "";
};

// REGISTER
registerForm.addEventListener("submit", async function (event) {
  event.preventDefault();

  if (!registerForm.reportValidity()) return;

  const name = document.getElementById("regName").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const password =
    document.getElementById("regPassword").value;

  const button = document.getElementById("registerBtn");
  button.disabled = true;
  message.textContent = "Creating account...";

  try {
    const { data, error } = await supabase.auth.signUp({
      phone: phone,
      password: password,
      options: {
        data: {
          full_name: name
        }
      }
    });

    if (error) throw error;

    // If phone verification is enabled, request the SMS OTP.
    if (data.user && !data.session) {
      const otp = prompt(
        "Enter the verification code sent to your phone:"
      );

      if (!otp) {
        message.textContent =
          "Account created. Verify your phone before logging in.";
        return;
      }

      const { error: verifyError } =
        await supabase.auth.verifyOtp({
          phone: phone,
          token: otp.trim(),
          type: "sms"
        });

      if (verifyError) throw verifyError;
    }

    message.textContent =
      "Registration successful! You can now log in.";

    document.getElementById("loginPhone").value = phone;
    document.getElementById("loginPassword").value = "";

    registerForm.reset();
    registerSection.hidden = true;
    loginSection.hidden = false;

  } catch (error) {
    message.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

// LOGIN
loginForm.addEventListener("submit", async function (event) {
  event.preventDefault();

  if (!loginForm.reportValidity()) return;

  const phone = document.getElementById("loginPhone").value.trim();
  const password =
    document.getElementById("loginPassword").value;

  const button = document.getElementById("loginBtn");
  button.disabled = true;
  message.textContent = "Logging in...";

  try {
    const { data, error } =
      await supabase.auth.signInWithPassword({
        phone: phone,
        password: password
      });

    if (error) throw error;

    message.textContent = "Login successful!";

    window.location.href = "index.html";

  } catch (error) {
    message.textContent =
      error.message || "Login failed. Please try again.";
  } finally {
    button.disabled = false;
  }
});

  </script>
</body>
</html>
