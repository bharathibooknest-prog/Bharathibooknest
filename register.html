
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Phone Login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f8eee3;
      color: #30251f;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px #0002;
    }

    h1, h2 { text-align: center; }
    h1 { color: #713d2b; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbb8a7;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      background: #713d2b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled { opacity: 0.6; }

    .switch {
      text-align: center;
      margin-top: 18px;
    }

    .switch button {
      width: auto;
      margin: 0;
      padding: 0;
      background: none;
      color: #713d2b;
      text-decoration: underline;
    }

    #message {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #713d2b;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main class="container">
    <h1>BharathiBookNest</h1>

    <section id="registerSection">
      <h2>Create Account</h2>

      <form id="registerForm">
        <label for="regName">Full Name</label>
        <input id="regName" type="text"
          minlength="2" maxlength="80"
          autocomplete="name" required>

        <label for="regPhone">Mobile Number</label>
        <input id="regPhone" type="tel"
          placeholder="+919876543210"
          pattern="\+[1-9][0-9]{7,14}"
          autocomplete="tel" required>

        <button type="submit" id="registerBtn">
          Send OTP & Register
        </button>
      </form>

      <p class="switch">
        Already registered?
        <button type="button" id="showLogin">Login</button>
      </p>
    </section>

    <section id="loginSection" hidden>
      <h2>Login</h2>

      <form id="loginForm">
        <label for="loginPhone">Mobile Number</label>
        <input id="loginPhone" type="tel"
          placeholder="+919876543210"
          pattern="\+[1-9][0-9]{7,14}"
          autocomplete="tel" required>

        <button type="submit" id="loginBtn">
          Send Login OTP
        </button>
      </form>

      <p class="switch">
        New to BookNest?
        <button type="button" id="showRegister">Register</button>
      </p>
    </section>

    <section id="otpSection" hidden>
      <h2>Verify OTP</h2>
      <p>Enter the verification code sent to your phone.</p>

      <form id="otpForm">
        <label for="otp">SMS verification code</label>
        <input id="otp" type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="10" required>

        <button type="submit" id="verifyBtn">
          Verify & Continue
        </button>
      </form>

      <button type="button" id="backBtn">
        Back
      </button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
    <a class="back" href="index.html">Back to Home</a>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://mlhveuqfxbpucorktost.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8ImFl6y1_2fsbQeAAFgFRg_RoCiGRy5";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = id => document.getElementById(id);

    const registerSection = $("registerSection");
    const loginSection = $("loginSection");
    const otpSection = $("otpSection");
    const message = $("message");

    let currentPhone = "";
    let currentMode = "register";

    function showMessage(text) {
      message.textContent = text;
    }

    function showSection(section) {
      registerSection.hidden = section !== registerSection;
      loginSection.hidden = section !== loginSection;
      otpSection.hidden = section !== otpSection;
    }

    function setBusy(button, busy, text) {
      button.disabled = busy;
      if (busy) button.textContent = text;
    }

    $("showLogin").addEventListener("click", () => {
      showSection(loginSection);
      showMessage("");
    });

    $("showRegister").addEventListener("click", () => {
      showSection(registerSection);
      showMessage("");
    });

    $("backBtn").addEventListener("click", () => {
      showSection(
        currentMode === "register"
          ? registerSection
          : loginSection
      );
      showMessage("");
    });

    async function sendOTP(phone, mode, name = "") {
      currentPhone = phone;
      currentMode = mode;

      const options = mode === "register"
        ? {
            shouldCreateUser: true,
            data: { full_name: name }
          }
        : {
            shouldCreateUser: false
          };

      const { error } = await supabase.auth.signInWithOtp({
        phone,
        options
      });

      if (error) throw error;

      showSection(otpSection);
      showMessage(
        "OTP request sent. Check your phone for the code."
      );
    }

    $("registerForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (!event.currentTarget.reportValidity()) return;

      const name = $("regName").value.trim();
      const phone = $("regPhone").value.trim();
      const button = $("registerBtn");

      setBusy(button, true, "Sending OTP...");
      showMessage("Please wait...");

      try {
        await sendOTP(phone, "register", name);
      } catch (error) {
        showMessage("Signup error: " + error.message);
      } finally {
        setBusy(button, false, "Send OTP & Register");
      }
    });

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (!event.currentTarget.reportValidity()) return;

      const phone = $("loginPhone").value.trim();
      const button = $("loginBtn");

      setBusy(button, true, "Sending OTP...");
      showMessage("Please wait...");

      try {
        await sendOTP(phone, "login");
      } catch (error) {
        showMessage("Login error: " + error.message);
      } finally {
        setBusy(button, false, "Send Login OTP");
      }
    });

    $("otpForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (!event.currentTarget.reportValidity()) return;

      const token = $("otp").value.trim();
      const button = $("verifyBtn");

      setBusy(button, true, "Verifying...");
      showMessage("Verifying OTP...");

      try {
        const { data, error } =
          await supabase.auth.verifyOtp({
            phone: currentPhone,
            token,
            type: "sms"
          });

        if (error) throw error;
        if (!data.session) {
          throw new Error("No login session received. Try again.");
        }

        showMessage("Verification successful! Opening BookNest...");
        window.location.replace("./index.html");
      } catch (error) {
        showMessage("Verification error: " + error.message);
      } finally {
        setBusy(button, false, "Verify & Continue");
      }
    });

    // Restore the user's saved session when this page opens.
    const { data: { session } } =
      await supabase.auth.getSession();

    if (session) {
      window.location.replace("./index.html");
    }
  </script>
</body>
</html>
