
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up - BharathiBookNest</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(255, 248, 239, 0.82),
                        rgba(255, 248, 239, 0.82)),
        url("./bharathiyar-background.png") center / cover fixed;
      color: #30251f;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 18px;
      background: rgba(255, 255, 255, 0.75);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    header h1 {
      margin: 5px 0;
      font-size: 26px;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 22px;
      padding: 14px;
      background: #713d2b;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .signup-box {
      width: 100%;
      max-width: 430px;
      padding: 30px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    .signup-box h2 {
      text-align: center;
      margin-top: 0;
      color: #713d2b;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #b78368;
      border-color: #713d2b;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: none;
      border-radius: 7px;
      background: #713d2b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #542c20;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.success {
      display: block;
      color: #155724;
      background: #d4edda;
    }

    #message.error {
      display: block;
      color: #721c24;
      background: #f8d7da;
    }

    .login-text {
      text-align: center;
      margin-top: 20px;
    }

    .login-text a {
      color: #713d2b;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: rgba(255, 255, 255, 0.8);
    }

    @media (max-width: 480px) {
      .signup-box {
        padding: 22px;
      }

      nav {
        gap: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <img
      src="./booknest-logo.png"
      alt="BharathiBookNest Logo"
      class="logo"
    >
    <h1>BharathiBookNest</h1>
    <p>Your Favourite Online Book Store</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="books.html">Books</a>
    <a href="cart.html">My Cart</a>
  </nav>

  <main>
    <section class="signup-box">
      <h2>Create Your Account</h2>

      <p class="subtitle">
        Join BharathiBookNest and discover your next favourite book.
      </p>

      <form id="signupForm">

        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email address"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Enter your password again"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button type="submit" id="signupButton">
          Create Account
        </button>

      </form>

      <div id="message" role="status" aria-live="polite"></div>

      <p class="login-text">
        Already have an account?
        <a href="index.html">Login here</a>
      </p>
    </section>
  </main>

  <footer>
    &copy; 2026 BharathiBookNest | Online Book Store
  </footer>

  <!-- Supabase JavaScript library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // STEP 1: Supabase project configuration

    const SUPABASE_URL =
      "https://mlhveuqfxbpucorktost.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8ImFl6y1_2fsbQeAAFgFRg_RoCiGRy5";

    // STEP 2: Connect to Supabase

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const signupForm = document.getElementById("signupForm");
    const signupButton = document.getElementById("signupButton");
    const messageBox = document.getElementById("message");

    // Display success or error messages

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = type;
    }

    // STEP 3: Handle signup

    signupForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const name = document.getElementById("fullName")
        .value.trim();

      const email = document.getElementById("email")
        .value.trim();

      const password = document.getElementById("password")
        .value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      messageBox.textContent = "";
      messageBox.className = "";

      // Check the password fields

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "Passwords do not match. Please try again.",
          "error"
        );
        return;
      }

      if (
        SUPABASE_PUBLISHABLE_KEY ===
        "YOUR_SUPABASE_PUBLISHABLE_KEY"
      ) {
        showMessage(
          "Please add your actual Supabase publishable key in register.html.",
          "error"
        );
        return;
      }

      signupButton.disabled = true;
      signupButton.textContent = "Creating Account...";

      try {
        // Create the account in Supabase Authentication

        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,

          options: {
            data: {
              full_name: name
            },

            emailRedirectTo:
              "https://bharathibooknest-prog.github.io/Bharathibooknest/"
          }
        });

        // Display the actual Supabase error

        if (error) {
          console.error("Supabase signup error:", error);

          showMessage(
            "Signup error: " + error.message,
            "error"
          );

          return;
        }

        // Check whether Supabase returned a user

        if (!data.user) {
          showMessage(
            "Supabase did not return a user. Please check your project settings.",
            "error"
          );
          return;
        }

        // Email verification may be required

        if (
          data.user.identities &&
          data.user.identities.length === 0
        ) {
          showMessage(
            "An account with this email may already exist. Try logging in or resetting your password.",
            "error"
          );
          return;
        }

        if (data.session) {
          showMessage(
            "Account created successfully! You are signed in. Go to the Home page to continue.",
            "success"
          );

          signupForm.reset();

        } else {
          showMessage(
            "Signup request accepted! Check your email inbox and spam folder, then click the verification link before logging in.",
            "success"
          );

          signupForm.reset();
        }

      } catch (error) {
        console.error("Unexpected signup error:", error);

        showMessage(
          "Unexpected error: " +
          (error.message || "Please try again."),
          "error"
        );

      } finally {
        signupButton.disabled = false;
        signupButton.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
