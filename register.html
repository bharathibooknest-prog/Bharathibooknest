<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Register & Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f8eee3;
      color: #30251f;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 25px #0002;
    }

    h1 {
      text-align: center;
      color: #713d2b;
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbb8a7;
      border-radius: 6px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #b88a68;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      background: #713d2b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
    }

    .switch button {
      width: auto;
      margin: 0;
      padding: 0;
      background: none;
      color: #713d2b;
      text-decoration: underline;
    }

    #message {
      text-align: center;
      overflow-wrap: anywhere;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #713d2b;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>BharathiBookNest</h1>

    <!-- REGISTER -->
    <section id="registerSection">
      <h2>Create Account</h2>

      <form id="registerForm">
        <label for="regName">Full Name</label>
        <input
          id="regName"
          type="text"
          autocomplete="name"
          minlength="2"
          maxlength="80"
          required
        >

        <label for="regPhone">Mobile Number</label>
        <input
          id="regPhone"
          type="tel"
          placeholder="+919876543210"
          autocomplete="tel"
          pattern="\+[1-9][0-9]{7,14}"
          title="Enter country code and number, e.g. +919876543210"
          maxlength="16"
          required
        >

        <label for="regPassword">Create Password</label>
        <input
          id="regPassword"
          type="password"
          minlength="8"
          maxlength="128"
          autocomplete="new-password"
          required
        >

        <button type="submit" id="registerBtn">
          Register
        </button>
      </form>

      <p class="switch">
        Already have an account?
        <button type="button" id="showLogin">Login</button>
      </p>
    </section>

    <!-- LOGIN -->
    <section id="loginSection" hidden>
      <h2>Login</h2>

      <form id="loginForm">
        <label for="loginPhone">Mobile Number</label>
        <input
          id="loginPhone"
          type="tel"
          placeholder="+919876543210"
          autocomplete="tel"
          pattern="\+[1-9][0-9]{7,14}"
          maxlength="16"
          required
        >

        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          type="password"
          maxlength="128"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginBtn">Login</button>
      </form>

      <p class="switch">
        New to BookNest?
        <button type="button" id="showRegister">Register</button>
      </p>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
    <a class="back" href="index.html">Back to Home</a>
  </main>

  <script>
    "use strict";

    const registerSection =
      document.getElementById("registerSection");

    const loginSection =
      document.getElementById("loginSection");

    const message =
      document.getElementById("message");

    const registerForm =
      document.getElementById("registerForm");

    const loginForm =
      document.getElementById("loginForm");

    const registerBtn =
      document.getElementById("registerBtn");

    const loginBtn =
      document.getElementById("loginBtn");

    const regName = document.getElementById("regName");
    const regPhone = document.getElementById("regPhone");
    const regPassword = document.getElementById("regPassword");

    const loginPhone = document.getElementById("loginPhone");
    const loginPassword = document.getElementById("loginPassword");

    // Switch to login form.
    document.getElementById("showLogin").addEventListener(
      "click",
      function () {
        registerSection.hidden = true;
        loginSection.hidden = false;
        message.textContent = "";
      }
    );

    // Switch to registration form.
    document.getElementById("showRegister").addEventListener(
      "click",
      function () {
        loginSection.hidden = true;
        registerSection.hidden = false;
        message.textContent = "";
      }
    );

    function normalizePhone(value) {
      return value.trim();
    }

    // Send JSON requests to the BookNest backend.
    async function sendRequest(url, payload) {
      let response;

      try {
        response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify(payload)
        });
      } catch (error) {
        console.error("Network request failed:", error);

        throw new Error(
          "Server connection failed. Open BookNest using http://localhost:3000/register.html and check that server.js is running."
        );
      }

      const contentType =
        response.headers.get("content-type") || "";

      let data;

      try {
        data = await response.json();
      } catch (error) {
        console.error("Invalid server response:", error);

        throw new Error(
          "Server returned an invalid response. Check the server terminal and server.js."
        );
      }

      if (!contentType.includes("application/json")) {
        throw new Error(
          "Expected a JSON response from the server. Check server.js."
        );
      }

      if (!response.ok) {
        throw new Error(
          data.message || "Request failed. Please try again."
        );
      }

      return data;
    }

    // REGISTER
    registerForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!registerForm.reportValidity()) return;

      const name = regName.value.trim();
      const phone = normalizePhone(regPhone.value);
      const password = regPassword.value;

      if (name.length < 2) {
        message.textContent = "Please enter your full name.";
        return;
      }

      registerBtn.disabled = true;
      message.textContent = "Creating account...";

      try {
        const data = await sendRequest("/api/register", {
          name: name,
          phone: phone,
          password: password
        });

        message.textContent =
          data.message || "Registration successful!";

        loginPhone.value = phone;
        loginPassword.value = "";

        registerForm.reset();
        registerSection.hidden = true;
        loginSection.hidden = false;

      } catch (error) {
        message.textContent =
          error.message || "Registration failed.";
      } finally {
        registerBtn.disabled = false;
      }
    });

    // LOGIN
    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!loginForm.reportValidity()) return;

      const phone = normalizePhone(loginPhone.value);
      const password = loginPassword.value;

      loginBtn.disabled = true;
      message.textContent = "Logging in...";

      try {
        const data = await sendRequest("/api/login", {
          phone: phone,
          password: password
        });

        message.textContent =
          data.message || "Login successful!";

        // Navigate only after the server confirms login.
        window.location.replace("/index.html");

      } catch (error) {
        message.textContent =
          error.message || "Login failed.";
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
