
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up | BharathiBookNest</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #30251f;
      background:
        linear-gradient(
          rgba(255, 248, 239, 0.78),
          rgba(255, 248, 239, 0.78)
        ),
        url("./bharathiyar-background.png") center / cover fixed;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 15px;
      background: rgba(255, 255, 255, 0.8);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    header h1 {
      margin: 5px 0;
      font-size: 26px;
      color: #30251f;
    }

    header p {
      margin: 5px 0;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
      padding: 14px;
      background: #713d2b;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 15px;
    }

    .signup-card {
      width: 100%;
      max-width: 440px;
      padding: 30px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
    }

    .signup-card h2 {
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
      color: #713d2b;
    }

    .description {
      margin-bottom: 25px;
      text-align: center;
      color: #666;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #b78368;
      border-color: #713d2b;
    }

    .show-password {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      font-size: 14px;
      font-weight: normal;
      cursor: pointer;
    }

    .show-password input {
      width: auto;
      margin: 0;
      cursor: pointer;
    }

    button {
      width: 100%;
      margin-top: 5px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #713d2b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #542c20;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 7px;
      overflow-wrap: anywhere;
      line-height: 1.5;
      font-size: 14px;
    }

    #message.success {
      display: block;
      background: #e2f5e8;
      color: #185c2c;
      border: 1px solid #b9dfc3;
    }

    #message.error {
      display: block;
      background: #fde8e8;
      color: #8b2020;
      border: 1px solid #efc1c1;
    }

    .login-link {
      margin-top: 22px;
      text-align: center;
    }

    .login-link a {
      color: #713d2b;
      font-weight: bold;
    }

    footer {
      padding: 15px;
      text-align: center;
      background: rgba(255, 255, 255, 0.8);
    }

    @media (max-width: 480px) {
      .signup-card {
        padding: 22px;
      }

      nav {
        gap: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <img
      src="./booknest-logo.png"
      alt="BharathiBookNest Logo"
      class="logo"
    >

    <h1>BharathiBookNest</h1>
    <p>Your Favourite Online Book Store</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="books.html">Books</a>
    <a href="cart.html">My Cart</a>
  </nav>

  <main>
    <section class="signup-card">

      <h2>Create Your Account</h2>

      <p class="description">
        Join BharathiBookNest and discover your favourite books.
      </p>

      <form id="signupForm">

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter your password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <!-- Show Password checkbox -->

        <label class="show-password">
          <input type="checkbox" id="showPassword">
          Show Password
        </label>

        <button type="submit" id="signupButton">
          Create Account
        </button>

      </form>

      <div
        id="message"
        role="status"
        aria-live="polite"
      ></div>

      <p class="login-link">
        Already have an account?
        <a href="index.html">Login here</a>
      </p>

    </section>
  </main>

  <footer>
    &copy; 2026 BharathiBookNest | Online Book Store
  </footer>

  <!-- Supabase JavaScript library -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    "use strict";

    // 1. Supabase configuration

    const SUPABASE_URL =
      "https://mlhveuqfxbpucorktost.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8ImFl6y1_2fsbQeAAFgFRg_RoCiGRy5";

    // 2. Get page elements

    const signupForm =
      document.getElementById("signupForm");

    const signupButton =
      document.getElementById("signupButton");

    const messageBox =
      document.getElementById("message");

    // 3. Show success and error messages

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = type;
    }

    // 4. Check Supabase library and configuration

    let supabaseClient = null;

    if (!window.supabase) {
      showMessage(
        "The Supabase library could not load. Check your internet connection and refresh the page.",
        "error"
      );

      signupButton.disabled = true;

    } else if (
      SUPABASE_PUBLISHABLE_KEY ===
      "YOUR_SUPABASE_PUBLISHABLE_KEY"
    ) {
      showMessage(
        "Setup required: Add your actual Supabase publishable key to this file.",
        "error"
      );

    } else {
      try {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );
      } catch (error) {
        console.error("Supabase setup error:", error);

        showMessage(
          "Supabase setup failed: " + error.message,
          "error"
        );
      }
    }

    // 5. Show or hide both password fields

    document.getElementById("showPassword").addEventListener(
      "change",
      function () {
        const type = this.checked ? "text" : "password";

        document.getElementById("password").type = type;

        document.getElementById("confirmPassword").type = type;
      }
    );

    // 6. Handle account registration

    signupForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      messageBox.textContent = "";
      messageBox.className = "";

      if (!supabaseClient) {
        showMessage(
          "Supabase is not configured. Check the publishable key and library loading.",
          "error"
        );
        return;
      }

      const name = document.getElementById("fullName")
        .value.trim();

      const email = document.getElementById("email")
        .value.trim();

      const password = document.getElementById("password")
        .value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (!name) {
        showMessage(
          "Please enter your full name.",
          "error"
        );
        return;
      }

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "The passwords do not match.",
          "error"
        );
        return;
      }

      signupButton.disabled = true;
      signupButton.textContent = "Creating Account...";

      try {
        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                full_name: name
              },
              emailRedirectTo:
                "https://bharathibooknest-prog.github.io/Bharathibooknest/"
            }
          });

        if (error) {
          console.error("Supabase signup error:", error);

          showMessage(
            "Signup failed: " + error.message,
            "error"
          );

          return;
        }

        if (!data || !data.user) {
          showMessage(
            "Supabase did not return a user. Check your project settings.",
            "error"
          );
          return;
        }

        if (
          data.user.identities &&
          data.user.identities.length === 0
        ) {
          showMessage(
            "This email may already be registered. Try logging in or resetting your password.",
            "error"
          );
          return;
        }

        if (data.session) {
          showMessage(
            "Account created successfully! You are now signed in. Go to the Home page to continue.",
            "success"
          );

          signupForm.reset();

        } else {
          showMessage(
            "Signup request accepted! Check your email inbox and spam folder for the verification link before logging in.",
            "success"
          );

          signupForm.reset();
        }

      } catch (error) {
        console.error("Unexpected signup error:", error);

        showMessage(
          "Signup error: " +
          (error.message || "An unexpected error occurred."),
          "error"
        );

      } finally {
        signupButton.disabled = false;
        signupButton.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
